task:
  alias: Go Lint
  container:
    image: golangci/golangci-lint:v1.64.8
  path_script:
    - source testdata/move_to_gopath.bash
  pkcs11mod_script:
    - cd $(go env GOPATH)/src/github.com/"$CIRRUS_REPO_FULL_NAME"
    - cd ../
    - git clone https://github.com/namecoin/pkcs11mod.git
    - cd pkcs11mod
    - git checkout api-fork-1.1.1.5
    - go mod init
    - go mod tidy
    - go generate ./...
    - go mod tidy
  fetch_script:
    - cd $(go env GOPATH)/src/github.com/"$CIRRUS_REPO_FULL_NAME"
    - go mod init github.com/"$CIRRUS_REPO_FULL_NAME"
    - go mod edit -replace github.com/miekg/pkcs11=github.com/namecoin/pkcs11@master-1.1.1.4 -replace github.com/namecoin/pkcs11mod=../pkcs11mod
    - go mod tidy
    - go generate ./...
    - go mod tidy
  # gomoddirectives is temporarily disabled until miekg/pkcs11 merges our changes.
  # interfacebloat complains about miekg/pkcs11 API's that we can't change.
  # ireturn doesn't make sense for us, since our functions can return arbitrary types provided by the user, so we need to return interfaces.
  # nosnakecase complains about miekg/pkcs11 API's that we can't change.
  lint_script:
    - cd $(go env GOPATH)/src/github.com/$CIRRUS_REPO_FULL_NAME/
    - golangci-lint run --enable-all --disable exhaustivestruct,exhaustruct,gochecknoglobals,gochecknoinits,gomoddirectives,interfacebloat,ireturn,nosnakecase $GOLANGCI_ARGS -v --out-format json > $CIRRUS_WORKING_DIR/lint-report.json
  matrix:
    - name: Go Lint New
      env:
        GOLANGCI_ARGS: "--new-from-rev=HEAD~"
    - name: Go Lint Mandatory
      env:
        GOLANGCI_ARGS: "--disable=cyclop,deadcode,dupl,funlen,gci,godot,godox,goerr113,gofmt,gofumpt,goimports,gomnd,gosimple,govet,ifshort,lll,nlreturn,noctx,nosnakecase,revive,unparam,unused,varcheck,varnamelen,wrapcheck,wsl --skip-dirs=ckbiproxy"
    - name: Go Lint
      env:
        GOLANGCI_ARGS: ""
      allow_failures: true
  always:
    golangci_artifacts:
      path: lint-report.json
      type: text/json
      format: golangci

task:
  name: "Functional Tests $CI_DISTRO Go $GO_VERSION"
  alias: "Functional Tests"
  matrix:
    - compute_engine_instance:
        image_project: debian-cloud
        image: family/debian-11
        platform: linux
        cpu: 1
        memory: 1G
      env:
        CI_DISTRO: debian
  bitcoind_cache:
    folder: /tmp/bitcoind
    populate_script: mkdir -p /tmp/bitcoind
  install_script:
    - apt-get update
    # bind9-dnsutils contains dig
    - apt-get install -y dnssec-trigger bind9-dnsutils firefox-esr openssl python3 libcap-dev
    # Namecoin Core
    - BITCOIND_URL=$(curl https://www.namecoin.org/download/ | grep x86_64-linux-gnu.tar.gz | grep -v 0.13.99 | grep --only-matching https://.*.tar.gz)
    - BITCOIND_FILENAME=$(echo $BITCOIND_URL | grep -E --only-matching 'namecoin-nc.*.tar.gz')
    - BITCOIND_PATH=/tmp/bitcoind/$BITCOIND_FILENAME
    - tar -xaf $BITCOIND_PATH || (rm -f /tmp/bitcoind/* && curl --output $BITCOIND_PATH $BITCOIND_URL && tar -xaf $BITCOIND_PATH)
    - cp -a namecoin-*/* /usr/
    # ncdns
    - NCDNS_URL=https://api.cirrus-ci.com/v1/artifact/github/namecoin/ncdns/Cross-Compile%20Go%20latest/binaries/dist/ncdns--linux_amd64.tar.gz
    - curl -o ncdns.tar.gz $NCDNS_URL
    - tar -xaf ncdns.tar.gz
    - cp -a ncdns--*/* /usr/
    # Encaya
    - |
        GO_URL=$(python3 -c 'import json, urllib.request; data = json.load(urllib.request.urlopen("https://go.dev/dl/?mode=json")); print(next("https://go.dev/dl/" + f["filename"] for r in data if r.get("stable") for f in r["files"] if f["os"] == "linux" and f["arch"] == "amd64" and f["kind"] == "archive"))')
        curl -fsSL "$GO_URL" -o go.tar.gz
        rm -rf /usr/local/go
        tar -C /usr/local -xzf go.tar.gz
        export PATH=/usr/local/go/bin:$PATH
        curl -fsSL -o encaya-src.tar.gz https://github.com/namecoin/encaya/archive/refs/heads/master.tar.gz
        tar -xaf encaya-src.tar.gz
        cd encaya-*
        go build -o /usr/bin/encaya .
        go build -o /usr/bin/encayagen ./encayagen
    # ncp11
    - NCP11_URL=https://api.cirrus-ci.com/v1/artifact/build/$CIRRUS_BUILD_ID/Compile%20Go%20$GO_VERSION%20linux%20amd64/binaries/dist/ncp11.tar.gz
    - curl -o ncp11.tar.gz $NCP11_URL
    - tar -xaf ncp11.tar.gz
    # Configure DNSSEC-Trigger
    - cp ncdns--*/doc/unbound.conf.d/ncdns.conf ncdns--*/doc/unbound.conf.d/ncdns-insecure.conf /etc/unbound/unbound.conf.d
    - systemctl restart unbound
  bitcoind_service_background_script:
    - testdata/run_bitcoind.sh
  ncdns_service_background_script:
    # ncdns refuses to run as root
    - adduser ncdns --disabled-password
    - ncdns -conf testdata/ncdns.conf
  encaya_service_background_script:
    # Avoid race condition in "adduser" between ncdns and encaya
    - sleep 5s
    # encaya refuses to run as root
    - adduser encaya --disabled-password
    - encayagen -conf "$(pwd)/testdata/encaya.conf"
    - chown encaya:encaya testdata/*.pem
    # Curiously, relative paths don't work here, they cause the .pem files to
    # not be detected.  Maybe file a bug with Hugo?
    - encaya -conf "$(pwd)/testdata/encaya.conf"
  regtest_script:
    - sleep 15s
    - testdata/regtest.sh
  depends_on:
    - "Compile Go $GO_VERSION linux amd64"
  env:
    GO_VERSION: latest
    MODULES_NAME: ""

task:
  name: "Functional Tests Windows Go $GO_VERSION"
  alias: "Functional Tests"
  compute_engine_instance:
    image_project: windows-cloud
    image: family/windows-2022
    platform: windows
    cpu: 4
    memory: 8G
  install_script:
    - $ErrorActionPreference = 'Stop'; Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12; Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1')); $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
    - |
        $ErrorActionPreference = 'Stop'
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          try {
            choco install -y openssl.light unbound
            break
          } catch {
            if ($attempt -eq 3) {
              throw
            }
            Start-Sleep -Seconds 15
          }
        }

        $firefoxBinary = 'C:\Program Files\Mozilla Firefox\firefox.exe'
        if (-not (Test-Path $firefoxBinary)) {
          $firefoxInstaller = Join-Path $env:TEMP 'firefox-installer.exe'

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              if (Test-Path $firefoxInstaller) {
                Remove-Item $firefoxInstaller -Force
              }

              Invoke-WebRequest -UseBasicParsing -Uri 'https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US' -OutFile $firefoxInstaller
              $installer = Start-Process $firefoxInstaller -ArgumentList '-ms' -Wait -PassThru
              if ($installer.ExitCode -ne 0 -or -not (Test-Path $firefoxBinary)) {
                throw "Firefox installer failed with exit code $($installer.ExitCode)"
              }
              break
            } catch {
              if ($attempt -eq 3) {
                throw
              }
              Start-Sleep -Seconds 15
            }
          }
        }
    - if (Test-Path windows-deps) { Remove-Item windows-deps -Recurse -Force }
    - New-Item -ItemType Directory -Path windows-deps | Out-Null
    - $ProgressPreference = 'SilentlyContinue'; Invoke-WebRequest -UseBasicParsing -Uri 'https://www.namecoin.org/files/namecoin-core/namecoin-core-22.0/namecoin-nc22.0-win64.zip' -OutFile 'windows-deps\namecoin.zip'
    - Expand-Archive -Path 'windows-deps\namecoin.zip' -DestinationPath 'windows-deps'
    - $ProgressPreference = 'SilentlyContinue'; Invoke-WebRequest -UseBasicParsing -Uri 'https://api.cirrus-ci.com/v1/artifact/github/namecoin/ncdns/Cross-Compile%20Go%20latest/binaries/dist/ncdns--windows_amd64.tar.gz' -OutFile 'windows-deps\ncdns.tar.gz'
    - tar -xf windows-deps\ncdns.tar.gz -C windows-deps; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'
        $goRelease = Invoke-RestMethod -UseBasicParsing -Uri 'https://go.dev/dl/?mode=json' | Where-Object { $_.stable } | Select-Object -First 1
        $goFile = $goRelease.files | Where-Object { $_.os -eq 'windows' -and $_.arch -eq 'amd64' -and $_.kind -eq 'archive' } | Select-Object -First 1
        Invoke-WebRequest -UseBasicParsing -Uri "https://go.dev/dl/$($goFile.filename)" -OutFile 'windows-deps\go.zip'
        Expand-Archive -Path 'windows-deps\go.zip' -DestinationPath 'windows-deps'
        $env:PATH = "$(Resolve-Path 'windows-deps\go\bin');$env:PATH"
        Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/namecoin/encaya/archive/refs/heads/master.zip' -OutFile 'windows-deps\encaya-src.zip'
        Expand-Archive -Path 'windows-deps\encaya-src.zip' -DestinationPath 'windows-deps'
        $encayaSource = Get-ChildItem -Path 'windows-deps' -Directory -Filter 'encaya-*' | Select-Object -First 1
        Push-Location $encayaSource.FullName
        go build -o (Join-Path $env:CIRRUS_WORKING_DIR 'windows-deps\encaya.exe') .
        go build -o (Join-Path $env:CIRRUS_WORKING_DIR 'windows-deps\encayagen.exe') .\encayagen
        Pop-Location
    - $ncp11Url = "https://api.cirrus-ci.com/v1/artifact/build/$env:CIRRUS_BUILD_ID/Compile%20Go%20$env:GO_VERSION%20windows%20amd64/binaries/dist/ncp11.tar.gz"; Invoke-WebRequest -UseBasicParsing -Uri $ncp11Url -OutFile 'windows-deps\ncp11.tar.gz'
    - tar -xf windows-deps\ncp11.tar.gz -C windows-deps; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  regtest_script:
    - powershell.exe -NoLogo -ExecutionPolicy Bypass -File testdata\regtest.ps1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  depends_on:
    - "Compile Go $GO_VERSION windows amd64"
  env:
    CIRRUS_SHELL: powershell
    GO_VERSION: latest

