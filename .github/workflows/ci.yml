# Attention: if you submit an improvement for a Namecoin CI config, please
# file a GitHub issue about it at the namecoin/meta repo, so that we can make
# sure it propagates to all the other Namecoin repos.  Thanks!

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: latest
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install
        run: dnf install -y ShellCheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        run: bash testdata/shellcheck.bash

  compile:
    name: Compile Go latest ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    container: golang:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: "386"
            cflags: -m32
            install: |
              dpkg --add-architecture i386
              apt-get update
              apt-get install -y gcc-multilib libc6-dev:i386
          - goos: linux
            goarch: arm
            cc: arm-linux-gnueabihf-gcc
            install: |
              dpkg --add-architecture armhf
              apt-get update
              apt-get install -y gcc-arm-linux-gnueabihf libc6-dev:armhf
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            install: |
              dpkg --add-architecture arm64
              apt-get update
              apt-get install -y gcc-aarch64-linux-gnu libc6-dev:arm64
          - goos: linux
            goarch: ppc64le
            cc: powerpc64le-linux-gnu-gcc
            install: |
              dpkg --add-architecture ppc64el
              apt-get update
              apt-get install -y gcc-powerpc64le-linux-gnu libc6-dev:ppc64el
          - goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc-win32
            install: |
              apt-get update
              apt-get install -y gcc-mingw-w64-x86-64
          - goos: windows
            goarch: "386"
            cc: i686-w64-mingw32-gcc-win32
            install: |
              apt-get update
              apt-get install -y gcc-mingw-w64-i686
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      # An empty CC would override make's default in pkcs11mod's go:generate.
      CC: ${{ matrix.cc || 'gcc' }}
      CFLAGS: ${{ matrix.cflags }}
    steps:
      - name: Install
        if: matrix.install
        run: ${{ matrix.install }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust repository
        run: git config --global --add safe.directory "$PWD"
      - name: Fetch
        run: bash testdata/prepare_go_module.bash
      - name: Build
        run: |
          SO_PREFIX=lib
          SO_EXT=so
          if [[ "$GOOS" == "windows" ]]
          then
          SO_PREFIX=""
          SO_EXT=dll
          fi
          mkdir -p dist
          CGO_ENABLED=1 go build -buildmode c-shared -o dist/${SO_PREFIX}ncp11.$SO_EXT
      - name: Dist
        run: |
          SO_EXT=so
          if [[ "$GOOS" == "windows" ]]
          then
          SO_EXT=dll
          fi
          mv dist/*.$SO_EXT ./
          mkdir -p ./dist
          tar -caf ./dist/ncp11.tar.gz ./*.$SO_EXT
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  compile-macos:
    name: Compile Go latest darwin amd64
    runs-on: macos-15-intel
    env:
      GOOS: darwin
      GOARCH: amd64
    steps:
      - name: Brew
        run: brew update
      - name: Go
        run: brew install go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch
        run: bash testdata/prepare_go_module.bash
      - name: Build
        run: |
          SO_PREFIX=lib
          SO_EXT=dylib
          mkdir -p dist
          CGO_ENABLED=1 go build -buildmode c-shared -o dist/${SO_PREFIX}ncp11.$SO_EXT
      - name: Dist
        run: |
          SO_EXT=dylib
          mv dist/*.$SO_EXT ./
          mkdir -p ./dist
          tar -caf ./dist/ncp11.tar.gz ./*.$SO_EXT
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-darwin-amd64
          path: dist/*

  lint:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: golang:latest
    strategy:
      fail-fast: false
      matrix:
        # golangci-lint v2 renamed --enable-all to --default=all, removed
        # --out-format and --skip-dirs, and removed or renamed several of the
        # linters named below (see the per-tier lists).
        include:
          - name: Go Lint New
            # ckbiproxy doesn't build against the pkcs11 fork; with v2 its type
            # errors fail every run, so skip it like Mandatory does.
            golangci_args: --new-from-rev=HEAD~ . ./fedorarealckbithinproxy/...
          - name: Go Lint Mandatory
            # v1 names: goerr113 is err113, gomnd is mnd, gosimple is part of
            # staticcheck, and deadcode, ifshort, nosnakecase and varcheck
            # were removed.  gci, gofmt, gofumpt and goimports are formatters,
            # which "run" no longer enables.  gocognit, goconst, gocritic,
            # gosec, modernize and nestif fail on the current code in v2.
            # --skip-dirs=ckbiproxy is replaced by not listing it.
            golangci_args: >-
              --disable=cyclop,dupl,funlen,godot,godox,err113,mnd,govet,lll,nlreturn,noctx,revive,unparam,unused,varnamelen,wrapcheck,wsl,wsl_v5
              --disable=gocognit,goconst,gocritic,gosec,modernize,nestif
              . ./fedorarealckbithinproxy/...
          - name: Go Lint
            # Was allow_failures on Cirrus; like ncdns and encaya, it now only
            # reports issues and always succeeds.
            golangci_args: --issues-exit-code=0 ./...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Trust repository
        run: git config --global --add safe.directory "$PWD"
      - name: Fetch
        run: bash testdata/prepare_go_module.bash
      # gomoddirectives is temporarily disabled until miekg/pkcs11 merges our changes.
      # interfacebloat complains about miekg/pkcs11 API's that we can't change.
      # ireturn doesn't make sense for us, since our functions can return arbitrary types provided by the user, so we need to return interfaces.
      # nosnakecase complains about miekg/pkcs11 API's that we can't change.
      # exhaustivestruct and nosnakecase, also disabled on Cirrus, no longer exist in v2; exhaustruct_v5 replaces exhaustruct.
      # depguard has no allow-list configured, and in v2 that rejects every non-stdlib import.
      # Like ncdns: problem matchers annotate the findings, and the text
      # output shows them in the log.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          problem-matchers: true
          experimental: no-run-logs-group
          args: >-
            --default=all
            --disable depguard,exhaustruct,exhaustruct_v5,gochecknoglobals,gochecknoinits,gomoddirectives,interfacebloat,ireturn
            ${{ matrix.golangci_args }}
            --output.text.path=stdout --output.json.path=lint-report.json
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golangci-${{ matrix.name }}
          path: lint-report.json

  upstream-artifacts:
    name: Find ncdns and Encaya artifacts
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      ncdns-run-id: ${{ steps.find.outputs.ncdns-run-id }}
      encaya-run-id: ${{ steps.find.outputs.encaya-run-id }}
    steps:
      - name: Find latest master builds
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prints the ID of the newest namecoin/$1 master build that still
          # has the artifact $2.  Its other jobs (e.g. lint) may have failed.
          find_run() {
            gh api "repos/namecoin/$1/actions/artifacts?name=$2&per_page=100" --jq '
              [.artifacts[]
               | select(.expired | not)
               | select(.workflow_run.head_branch == "master")
               | select(.workflow_run.head_repository_id == .workflow_run.repository_id)]
              | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
          }

          ncdns_run_id="$(find_run ncdns binaries-linux_amd64)"
          encaya_run_id="$(find_run encaya binaries-linux-amd64)"
          if [[ -z "$ncdns_run_id" || -z "$encaya_run_id" ]]; then
            echo "Missing upstream artifact (ncdns: '$ncdns_run_id', encaya: '$encaya_run_id')"
            exit 1
          fi

          echo "ncdns-run-id=$ncdns_run_id" >> "$GITHUB_OUTPUT"
          echo "encaya-run-id=$encaya_run_id" >> "$GITHUB_OUTPUT"
          {
            echo "ncdns: https://github.com/namecoin/ncdns/actions/runs/$ncdns_run_id"
            echo "Encaya: https://github.com/namecoin/encaya/actions/runs/$encaya_run_id"
          } >> "$GITHUB_STEP_SUMMARY"

  functional-tests:
    name: Functional Tests ${{ matrix.CI_DISTRO }} Go latest
    needs:
      - compile
      - upstream-artifacts
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Cirrus used Debian 11 VMs, which are past end of life; Debian 12 and
        # 13 are what encaya's Cirrus config moved to.
        include:
          - CI_DISTRO: debian-12
            image: debian:12
          - CI_DISTRO: debian-13
            image: debian:13
    container: ${{ matrix.image }}
    env:
      # Cirrus ran as root with HOME=/root.  GitHub sets HOME to /github/home,
      # owned by the runner's UID 1001, and Firefox refuses to run as root
      # when $HOME belongs to another user.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bitcoind cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bitcoind
          key: bitcoind-namecoin-nc22.0-x86_64-linux-gnu
      - name: Download ncdns
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-linux_amd64
          repository: namecoin/ncdns
          run-id: ${{ needs.upstream-artifacts.outputs.ncdns-run-id }}
          github-token: ${{ github.token }}
      - name: Download Encaya
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-linux-amd64
          repository: namecoin/encaya
          run-id: ${{ needs.upstream-artifacts.outputs.encaya-run-id }}
          github-token: ${{ github.token }}
      - name: Download ncp11
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-linux-amd64
      - name: Install
        run: |
          apt-get update
          # bind9-dnsutils contains dig
          # The VMs Cirrus used already had curl, ca-certificates, libcap2 and
          # xxd; these containers don't.
          apt-get install -y dnssec-trigger bind9-dnsutils firefox-esr curl ca-certificates libcap2 xxd
          # Namecoin Core
          mkdir -p /tmp/bitcoind
          # Temporarily downgrade Namecoin Core until deterministic salts with descriptor wallets are fixed.
          #BITCOIND_URL=$(curl https://www.namecoin.org/download/ | grep x86_64-linux-gnu.tar.gz | grep -v 0.13.99 | grep --only-matching https://.*.tar.gz)
          BITCOIND_URL="https://www.namecoin.org/files/namecoin-core/namecoin-core-22.0/namecoin-nc22.0-x86_64-linux-gnu.tar.gz"
          BITCOIND_FILENAME=$(echo $BITCOIND_URL | grep -E --only-matching 'namecoin-nc.*.tar.gz')
          BITCOIND_PATH=/tmp/bitcoind/$BITCOIND_FILENAME
          tar -xaf $BITCOIND_PATH || (rm -f /tmp/bitcoind/* && curl --output $BITCOIND_PATH $BITCOIND_URL && tar -xaf $BITCOIND_PATH)
          cp -a namecoin-*/* /usr/
          # ncdns
          tar -xaf ncdns--linux_amd64.tar.gz
          cp -a ncdns--*/* /usr/
          # Encaya
          tar -xaf encaya--linux_amd64.tar.gz
          cp -a encaya--*/* /usr/
          # ncp11
          tar -xaf ncp11.tar.gz
          # Configure DNSSEC-Trigger
          cp ncdns--*/doc/unbound.conf.d/ncdns.conf ncdns--*/doc/unbound.conf.d/ncdns-insecure.conf /etc/unbound/unbound.conf.d
      - name: Services
        run: |
          # Containers have no systemd, so instead of "systemctl restart unbound"
          # run what its service does: unbound-helper creates the DNSSEC root
          # trust anchor (/var/lib/unbound/root.key), then unbound starts.  Then
          # point the resolver at it, which DNSSEC-Trigger did on the VM.
          /usr/libexec/unbound-helper chroot_setup || true
          /usr/libexec/unbound-helper root_trust_anchor_update || true
          unbound -d -p > /tmp/unbound.log 2>&1 &
          printf 'nameserver 127.0.0.1\n' > /etc/resolv.conf

          # bitcoind_service_background_script
          testdata/run_bitcoind.sh > /tmp/bitcoind.log 2>&1 &

          # ncdns_service_background_script
          # ncdns refuses to run as root
          adduser ncdns --disabled-password
          ncdns -conf testdata/ncdns.conf > /tmp/ncdns.log 2>&1 &

          # encaya_service_background_script
          # Avoid race condition in "adduser" between ncdns and encaya
          sleep 5s
          # encaya refuses to run as root
          adduser encaya --disabled-password
          encayagen -conf "$(pwd)/testdata/encaya.conf"
          chown encaya:encaya testdata/*.pem
          # Curiously, relative paths don't work here, they cause the .pem files to
          # not be detected.  Maybe file a bug with Hugo?
          encaya -conf "$(pwd)/testdata/encaya.conf" > /tmp/encaya.log 2>&1 &
      - name: Regtest
        run: |
          sleep 15s
          # A cold DNS cache or first Firefox start can exceed try-firefox-connect.bash's 10s timeout.
          dig www.namecoin.org > /dev/null || true
          timeout 60 firefox --screenshot about:blank > /dev/null 2>&1 || true
          rm -rf ~/.mozilla screenshot.png
          testdata/regtest.sh
      - name: Service logs
        if: failure()
        run: cat /tmp/unbound.log /tmp/bitcoind.log /tmp/ncdns.log /tmp/encaya.log

